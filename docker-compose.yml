services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: livinit
      POSTGRES_PASSWORD: livinit
      POSTGRES_DB: livinit
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U livinit -d livinit"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
